name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUF_VERSION: 1.72.0

jobs:
  go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Both modules. examples/ holds the tests that exercise generated code and
      # the runnable program, and it is a module of its own — a root-only gofmt
      # would leave all of it unchecked.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l plugin examples doc.go boundary_test.go)"
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files (run: gofmt -w .)"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (examples)
        working-directory: examples
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # examples/ is a module of its own, and golangci-lint does not cross a
      # module boundary — the invocation above never sees it. It holds the
      # runnable program and the two test doubles, which is real code.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: examples

  proto:
    name: Lint (Proto)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf build
        run: buf build

      - name: buf lint
        run: buf lint

      - name: buf format
        run: buf format --diff --exit-code

      - name: Generated stubs up to date
        run: |
          buf generate
          git diff --exit-code -- plugin/pb/ \
            || (echo "::error::generated stubs are stale — run 'buf generate' and commit" && exit 1)

  aip:
    name: Lint (AIP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install api-linter
        run: go install github.com/googleapis/api-linter/cmd/api-linter@latest

      # No config file and no disabled rule, for the published vocabulary and the
      # examples alike. This plugin reads google.api.resource to decide a
      # namespace and hard-errors on an unbound parent segment; holding its users
      # to AIP while ducking it here would be incoherent.
      - name: api-linter
        run: ./scripts/aip.sh
