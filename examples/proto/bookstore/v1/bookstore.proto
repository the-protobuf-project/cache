syntax = "proto3";

// Package bookstore.v1 is this repository's copy of the store plugin's sample
// proto, annotated additionally in cache.v1.
//
// It is a copy on purpose. Annotating the store repository's own example would
// be a change to the store repository, and the point of this plugin is that it
// needs none — so the cache annotations live here, next to the plugin that reads
// them, and both generators run over this tree.
//
// Three vocabularies, three questions:
//
//	entity.v1  what is this thing named?      (shared; every plugin agrees)
//	store.v1   how is it stored?              (protoc-gen-store's own)
//	cache.v1   how is it cached, and from whom is it isolated?
package bookstore.v1;

import "cache/v1/annotations.proto";
import "entity/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "store/v1/annotations.proto";

option java_multiple_files = true;
option java_outer_classname = "BookstoreProto";
option java_package = "com.bookstore.v1";
// Defaults every cached resource in this file inherits unless it overrides them.
// ttl lives here because it is the option most likely to be identical across a
// package and most costly to get wrong by omission.
option (cache.v1.cache_defaults) = {
  ttl: {seconds: 300}
};
// Files in this package declare the same datasource name, so bookstore.proto
// and inventory.proto merge into one bookstore_db schema tree.
option (entity.v1.datasource) = {
  database: "bookstore_db"
  provider: "postgres"
  url: "postgresql://user:pass@localhost:5432/bookstore_db"
};

// Author is a top-level resource. Inferred table: bookstore_v1.authors.
// id: ID_STRATEGY_ULID synthesizes a generated `id` PK and demotes the AIP
// resource name to a UNIQUE lookup column; timestamps adds created_at/updated_at.
message Author {
  option (google.api.resource) = {
    type: "bookstore.v1/Author"
    pattern: "authors/{author}"
    singular: "author"
    plural: "authors"
  };
  option (entity.v1.table) = {
    id: ID_STRATEGY_ULID
    timestamps: true
  };
  // ASIDE: read-through by id, single-flighted, with a stale window so a reader
  // arriving after the lease runs out is served immediately while the load
  // happens behind it. The pattern has no parent segment, so the namespace takes
  // no scope and the generated constructor takes none either.
  option (cache.v1.cache) = {
    enabled: true
    strategy: STRATEGY_ASIDE
    stale: {seconds: 30}
  };

  // name is the AIP resource name; UNIQUE NOT NULL lookup key (id is the PK).
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // display_name is REQUIRED → NOT NULL; string → VARCHAR(255) default.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // bio is free-form; override the VARCHAR(255) default to unbounded TEXT, nullable.
  string bio = 3 [(store.v1.column) = {type: "TEXT"}];
}

// Book is a resource nested under Author. Inferred table: bookstore_v1.books.
message Book {
  option (google.api.resource) = {
    type: "bookstore.v1/Book"
    pattern: "authors/{author}/books/{book}"
    singular: "book"
    plural: "books"
  };

  // Extra composite index: (author_id, published_year) for timeline queries.
  option (entity.v1.table) = {
    indexes: [
      {
        columns: [
          "author_id",
          "published_year"
        ]
        index: "idx_books_author_year"
      }
    ]
  };

  // INDEXED: books are looked up by ISBN as often as by id, and a secondary
  // index is what makes that one round trip instead of a scan. It requires a
  // backend with server-side sets — memcached has none — so the generated
  // constructor asserts that capability before returning a decorator.
  option (cache.v1.cache) = {
    enabled: true
    strategy: STRATEGY_INDEXED
    ttl: {seconds: 120}
  };

  // name: IDENTIFIER → PRIMARY KEY, VARCHAR(255).
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // title: REQUIRED NOT NULL; max_length caps the VARCHAR provider-neutrally.
  string title = 2 [
    (google.api.field_behavior) = REQUIRED,
    (store.v1.column) = {max_length: 500}
  ];

  // author_id references Author; store infers the FOREIGN KEY, aligns the
  // column type with the referenced PK (CHAR(26) ULID), and applies CASCADE.
  //
  // cache_scope is what makes this proto generate at all. Book's pattern nests
  // it under {author}, and a cache answers before the store is consulted — so
  // without the parent bound into the namespace, the store's row-level scoping
  // never runs and one author's books are readable from another's decorator.
  // The generator hard-errors on an unbound parent segment; this is the binding.
  string author_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bookstore.v1/Author"},
    (store.v1.column) = {on_delete: REFERENTIAL_ACTION_CASCADE},
    (cache.v1.cache_scope) = {}
  ];

  // isbn must be globally unique; custom fixed-width type.
  //
  // cache_index files it as a secondary index. It is a sound thing to index
  // precisely because store.v1 marks it unique: one value maps to at most one
  // book, so the index set stays a single member rather than becoming the hot
  // key an index on something low-cardinality would.
  string isbn = 4 [
    (store.v1.column) = {
      type: "VARCHAR(13)"
      unique: true
    },
    (cache.v1.cache_index) = {}
  ];

  // published_year is a plain integer column; nullable.
  int32 published_year = 5;

  // internal_notes exists only in the proto contract; excluded from the DB.
  string internal_notes = 6 [(entity.v1.column) = {skip: true}];

  // genre demonstrates proto enum → database enum generation.
  Genre genre = 7 [(google.api.field_behavior) = REQUIRED];

  // create_time is set by the database on insert.
  google.protobuf.Timestamp create_time = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "now()"}
  ];
}

// Genre classifies a book's literary category.
enum Genre {
  // Default value; the genre has not been specified.
  GENRE_UNSPECIFIED = 0;

  // Fictional works: novels, short stories.
  GENRE_FICTION = 1;

  // Non-fiction works: biographies, essays, reference.
  GENRE_NON_FICTION = 2;

  // Science fiction works.
  GENRE_SCI_FI = 3;

  // Fantasy works.
  GENRE_FANTASY = 4;
}
