[package]
name = "cache-rust-example"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compiles protoc-gen-cache's lang=rust golden output against runtime-rs and tests it"

# Standalone: not a member of any enclosing workspace.
[workspace]

[dependencies]
# runtime-rs by path. It points at the feat/cached-repository worktree (on top of
# feat/repository-impl), which adds database::repository::cached and cache::DB::under;
# switch to ../../../runtime/runtime-rs once that branch is merged.
database = { package = "tpp-database", path = "../../../runtime/runtime-rs-cache-repo/database", default-features = false, features = ["cached"] }
cache = { package = "tpp-cache", path = "../../../runtime/runtime-rs-cache-repo/cache" }
prost = "0.14"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.23"
