[package]
name = "cache-rust-example"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compiles protoc-gen-cache's lang=rust golden output against runtime-rs and tests it"

# Standalone: not a member of any enclosing workspace.
[workspace]

[dependencies]
# runtime-rs at the merge of runtime-rs#49, which added database::repository::cached and
# cache::DB::under, the runtime the generated decorators are written against.
database = { package = "tpp-database", git = "https://github.com/the-protobuf-project/runtime-rs", rev = "53f2ffbfefc2caa2c02ba4d62637ede614103b17", default-features = false, features = ["cached"] }
cache = { package = "tpp-cache", git = "https://github.com/the-protobuf-project/runtime-rs", rev = "53f2ffbfefc2caa2c02ba4d62637ede614103b17" }
prost = "0.14"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.23"
